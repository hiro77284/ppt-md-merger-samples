version: 4

# 実行: pptmdmerge ppt_build <THISFILE>.yaml --githubmd --transfer --pdf --yes-clear-dir
#
# 生成物の置き場（すべて gitignore 済み。src/ から再生成できる）
#   ../images/   pptimgexport が切り出す画像
#   ../mds/      pptyamlexport / note 抽出が書き出す md
#   ../temppdfs/ 画像切り出し用のスライド PDF
#   ../build/    結合・render 済み md と PDF
# 管理するのは src/ と、transfer が書き出す ../README.md・../readme-images/ だけ。

vars:
  COVER_TITLE: "大きなPPTXファイルに章・節番号を付番する"
  COVER_SUBTITLE: "ページ数の多いPPTXファイルに自動的に章・節番号を付番する方法の解説とサンプル"
  COVER_DATE: __DATETIME__
  COVER_AUTHOR: "アイデアクラフト"
  #COVER_IMAGE: ../images/cover_image.webp

log:
  level: info
  filename: log.txt

indexer:
  # 章節番号付与方式の設定
  pptxnumbering: "idresolve"       # PPTX中に#CHAPT# #SECTION# マーカーを書く

output:
  outputdir: ../build
  targetbasefilename: 105-pptx-numbering_target
  pdffilename: 105-pptx-numbering_target.pdf
  pptxfilename: 105-pptx-numbering_target.pptx
  force: true

merge:
  copy-images: true
  image-dir: ../build/images
  flatten-images: true
  strict: true

fragment:
  dirs:
    - .
    - ../mds

source:
  cropimagedirs:
    - ../images
  cropsrc:
    pptx: 105-pptx-numbering.pptx
    pdf: ../temppdfs/105-pptx-numbering.pdf

# 事例ページ（../README.md と ../readme-images/）を書き出す
transfer:
  dataentry_input: ..
  slug: readme-images
  inputmd: 105-pptx-numbering_target_github.md
  outputmd: README.md
  image_naming: sanitize
  image_collision: overwrite

pandoc:
  resource-path:
    - ../build
  # 共通設定はリポジトリ直下の user_settings/ に置く（本体 examples/ と同じ深さ）
  data-dir: ../../../user_settings
  # PDFに2階層で目次をつける defaults を指定
  defaults: pandoc/defaults/report_base_defaults_toc2level.yaml
  # 表紙を付けるときは同梱の cover_standard.md を指定するか、コピーして src/ に置く
  cover-md: cover_standard.md

procedure:
  - insertpptx: 105-pptx-numbering.pptx
    slides: all
  - insertmdpages: 105-pptx-numbering_slide[1-END].md
