version: 4

# 事例の生成指示書（雛形）。cases/001-pdf1-minimum/src/pdf1_minimum_pdf_recipe.yaml を短くしたもの。
# TEMPLATE を事例の原稿名（pptx のファイル名から拡張子を除いたもの）に置き換えて使う。
# 実行: cd src && ppt_build 102-cover-index_recipe.yaml --githubmd --transfer --pdf --yes-clear-dir
#
# 生成物の置き場（すべて gitignore 済み。src/ から再生成できる）
#   ../images/   pptimgexport が切り出す画像
#   ../mds/      pptyamlexport / note 抽出が書き出す md
#   ../temppdfs/ 画像切り出し用のスライド PDF
#   ../build/    結合・render 済み md と PDF
# 管理するのは src/ と、transfer が書き出す ../README.md・../readme-images/ だけ。

vars:
  COVER_TITLE: "複数の原稿PPTXをマージしてPDFおよび単一のPPTXを生成する方法"
  COVER_SUBTITLE: "複数の原稿PPTXをマージして、章節構造で付番されたPDFと単一のPPTXを同じ構成で生成する方法の解説とサンプル"
  COVER_NOTE: "マージするための merge.dirs と、PDFとPPTXを生成するための procedure の設定方法を解説します"
  COVER_DATE: __DATETIME__
  COVER_AUTHOR: "開米瑞浩"
  COVER_AFFILIATION: "アイデアクラフト"

log:
  level: info
  filename: log.txt

indexer:  # 章節番号付与方式の設定
  pptxnumbering: idresolve
  autoid: false

output:
  outputdir: ../build
  targetbasefilename: 104-multi-pptx-merge_target
  pptxfilename: 104-multi-pptx-merge_target.pptx
  renderedfilename: 104-multi-pptx-merge_target_rendered.md
  githubmdfilename: 104-multi-pptx-merge_target_github.md
  pdffilename: 104-multi-pptx-merge_target.pdf
  force: true

merge:
  copy-images: true
  image-dir: ../build/images
  flatten-images: true
  strict: true

fragment:
  dirs:
    - .
    - ../mds

source:
  cropimagedirs:
    - ../images

  cropsrc:
    - pptx: 104-multi-pptx-merge.pptx
      pdf: ../temppdfs/104-multi-pptx-merge.pdf
    - pptx: additional.pptx
      pdf: ../temppdfs/additional.pdf

# 事例ページ（../README.md と ../readme-images/）を書き出す
transfer:
  dataentry_input: ..
  slug: readme-images
  inputmd: 104-multi-pptx-merge_target_github.md
  outputmd: README.md
  image_naming: sanitize
  image_collision: overwrite

pandoc:
  resource-path:
    - ../build
  # 共通設定はリポジトリ直下の user_settings/ に置く（本体 examples/ と同じ深さ）
  data-dir: ../../../user_settings
  # PDFに2階層で目次をつける defaults を指定
  defaults: pandoc/defaults/report_base_defaults_toc2level.yaml
  # 表紙を付けるときは同梱の cover_standard.md を指定するか、コピーして src/ に置く
  cover-md: cover_standard.md

procedure:
  - insertpptx: 104-multi-pptx-merge.pptx
    slides: 1-END
  - insertmdpages: 104-multi-pptx-merge_slide[1-END].md

  - insertpptx: additional.pptx
    slides: 1,2,3,5-END
  - insertmdpages: additional_slide[1,2,3,5-END].md

