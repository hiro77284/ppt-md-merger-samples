# 事例メタデータ（雛形）。cases/NNN-slug/case.yml としてコピーし、<...> を書き換える。
# ルート README.md の一覧は scripts/build_index.py がこのファイルから生成する。

# 必須 ----------------------------------------------------------------
id: 102-cover-index                 # フォルダ名と同じにする（例: 002-chapter-cover）
title: 表紙と目次をつけてPDF生成
summary: PDF生成時に表紙と目次を付加する設定項目の解説
tags: [cover,index]                  # 推奨タグは CONTRIBUTING.md を参照
ppt_md_merger_version: "2.0.6"   # この事例を最後にビルドして確認した ppt-md-merger のバージョン

# 任意 ----------------------------------------------------------------
recipe_version: 4              # レシピの version（一覧には出さない。将来の一括移行用）
build:                         # 再生成手順。上から順に実行する（cases/<id>/ 基準のパス）
  - recipe: src/102-cover-index_recipe.yaml
    command: ppt_build
    options: --githubmd --transfer --pdf --yes-clear-dir --keep-work
outputs: [pdf, githubmd]       # 生成物の種類: pdf / githubmd / puremd / html / reveal / pptx
thumbnail: readme-images/102-cover-index-slide2.webp                     # 省略時は thumbnail.png / .webp / .jpg を探す。無ければ一覧に画像なし
added: 2026-11-25            # 追加日
updated:                       # 内容を更新した日（任意）
